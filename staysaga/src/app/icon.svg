<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <style>
    path { stroke: #000; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #fff; }
    }
  </style>
  
  <!-- Right roof -->
  <path d="M 50 12 L 78 35" />
  
  <!-- Main continuous line: Left roof + Bottom of S -->
  <path d="M 50 12 
           L 22 35 
           C 12 45, 25 55, 45 55 
           L 55 55 
           C 75 55, 85 85, 55 85 
           C 30 85, 20 70, 30 60
           C 35 55, 40 55, 40 55" />
           
  <!-- Inner top curl of S -->
  <path d="M 22 35 
           C 25 15, 60 15, 60 30 
           C 60 45, 45 48, 45 48" />
</svg>
